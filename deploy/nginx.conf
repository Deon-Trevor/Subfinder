user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format concise '$remote_addr $request_method $uri $status $request_time';
    access_log /var/log/nginx/access.log concise;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 15s;
    client_body_timeout 5s;
    client_header_timeout 5s;
    client_max_body_size 1m;
    send_timeout 30s;

    # Docker service addresses change when Compose recreates the API. Resolve
    # the service name continuously so a backend-only deployment cannot leave
    # this long-lived edge pinned to a dead container address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The host NGINX must replace X-Forwarded-For with one trusted client
    # address. Direct loopback callers fall back to their socket address.
    map $http_x_forwarded_for $subfinder_client {
        ""      $remote_addr;
        default $http_x_forwarded_for;
    }

    limit_req_zone $server_name zone=subfinder_global_rate:1m rate=10r/s;
    limit_req_zone $subfinder_client zone=subfinder_client_rate:10m rate=10r/s;
    limit_conn_zone $server_name zone=subfinder_global_conn:1m;
    limit_conn_zone $subfinder_client zone=subfinder_client_conn:10m;

    upstream subfinder_api {
        zone subfinder_api 64k;
        server ctlogs:8200 resolve;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        location @edge_overloaded {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header Retry-After "1" always;
            add_header X-Overload-Reason "edge-capacity" always;
            return 503 '{"detail":"public edge capacity is temporarily unavailable"}';
        }

        # Host NGINX always adds one sanitized client address. Health is for
        # local probes only so an attacker cannot bypass admission through it.
        location = /health {
            if ($http_x_forwarded_for != "") {
                return 404;
            }

            proxy_pass http://subfinder_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
        }

        # Internal data-plane routes are never exposed by the public edge.
        location ^~ /internal/ {
            return 404;
        }

        location / {
            limit_req zone=subfinder_global_rate burst=80 nodelay;
            limit_req zone=subfinder_client_rate burst=80 nodelay;
            limit_conn subfinder_global_conn 96;
            limit_conn subfinder_client_conn 80;
            limit_req_status 503;
            limit_conn_status 503;
            error_page 503 = @edge_overloaded;

            proxy_pass http://subfinder_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For $subfinder_client;
            proxy_set_header X-Real-IP $subfinder_client;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
