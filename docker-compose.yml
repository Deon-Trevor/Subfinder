services:
  ctlogs:
    build: .
    image: ctlogs:latest
    ports:
      - "8200:8200"
    volumes:
      - ctlogs-data:/data
    environment:
      CTLOGS_DB_PATH: /data/ctlogs.sqlite3
      CTLOGS_AUTO_SEED: "0"
      CTLOGS_ENABLE_LIVE_CT: "1"
      CTLOGS_STATIC_CT_URLS: "https://mon.willow.ct.letsencrypt.org/2026h2"
      CTLOGS_ALLOWED_HOSTS: "127.0.0.1:*,localhost:*,[::1]:*"
      CTLOGS_ALLOWED_ORIGINS: "http://127.0.0.1:*,http://localhost:*"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8200/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  jobs:
    image: ctlogs:latest
    profiles: ["jobs"]
    entrypoint: ["python"]
    healthcheck:
      disable: true
    volumes:
      - ctlogs-data:/data
    env_file:
      - path: .env.providers
        required: false
        format: raw

  scheduler:
    build: .
    image: ctlogs:latest
    entrypoint: ["python", "-m", "ctlogs.scheduler"]
    healthcheck:
      disable: true
    restart: unless-stopped
    volumes:
      - ctlogs-data:/data
    environment:
      CTLOGS_DB_PATH: /data/ctlogs.sqlite3
      CTLOGS_SCHEDULER_LOCK: /data/scheduler.lock
      CTLOGS_SCHEDULER_INTERVAL: "86400"
      CTLOGS_SCHEDULER_RETRY_INTERVAL: "3600"
      CTLOGS_CZDS_MAX_ZONES: "25"
      CTLOGS_SCHEDULE_URLSCAN: "0"
    env_file:
      - path: .env.providers
        required: false
        format: raw

  urlscan-scheduler:
    build: .
    image: ctlogs:latest
    entrypoint: ["python", "-m", "ctlogs.scheduler"]
    healthcheck:
      disable: true
    restart: unless-stopped
    volumes:
      - ctlogs-data:/data
    environment:
      CTLOGS_DB_PATH: /data/ctlogs.sqlite3
      CTLOGS_SCHEDULER_LOCK: /data/urlscan-scheduler.lock
      CTLOGS_SCHEDULE_DEFAULTS: "0"
      CTLOGS_SCHEDULE_CZDS: "0"
      CTLOGS_URLSCAN_APEXES_PER_RUN: "250"
      CTLOGS_URLSCAN_INTERVAL: "60"
      CTLOGS_URLSCAN_RETRY_INTERVAL: "60"
    env_file:
      - path: .env.providers
        required: false
        format: raw

volumes:
  ctlogs-data:
    name: ${CTLOGS_DATA_VOLUME:-ctlogs_ctlogs-data}
