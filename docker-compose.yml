services:
  ctlogs:
    build: .
    image: ctlogs:latest
    ports:
      - "8000:8000"
    volumes:
      - ctlogs-data:/data
    environment:
      CTLOGS_DB_PATH: /data/ctlogs.sqlite3
      CTLOGS_ALLOWED_HOSTS: "127.0.0.1:*,localhost:*,[::1]:*"
      CTLOGS_ALLOWED_ORIGINS: "http://127.0.0.1:*,http://localhost:*"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  ctlogs-data:
